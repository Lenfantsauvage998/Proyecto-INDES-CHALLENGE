app = "isse-certificados"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8001"
  DB_PATH = "/data/teaching.db"
  EXCEL_PATH = "/data/source.xlsx"

[[mounts]]
  source = "isse_data"
  destination = "/data"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/stats"
  timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
